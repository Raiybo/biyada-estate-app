<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biyada Estate</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f5f4a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="auth" class="auth" hidden></div>

  <div id="shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="28" height="28">
        <span>Biyada Estate</span>
      </div>
      <label class="project-picker">
        <span class="muted small">Project</span>
        <select id="projectSelect"></select>
      </label>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="whoami" class="small"></div>
        <button class="btn ghost small" id="logoutBtn">Sign out</button>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button class="btn ghost icon-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h1 id="pageTitle"></h1>
        <div id="pageActions" class="page-actions"></div>
      </header>
      <div id="guestBanner" class="guest-banner" hidden>You're exploring as a <b>guest</b> in a sample project. Try anything; it doesn't touch real books.</div>
      <main id="main"></main>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm" novalidate>
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="btn ghost icon-btn" data-close aria-label="Close">✕</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalError" class="error" hidden></div>
      <footer id="modalFoot" class="modal-foot"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="sql-wasm.js"></script>
  <script src="local-backend.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
</body>
</html>
